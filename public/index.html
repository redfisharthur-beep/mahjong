<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>象棋麻將爭霸</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f4ef; --card-bg: #fffaf5; --card-border: #e6d7cc;
            --text-main: #6b5b53; --text-light: #9e8a80; --button-bg: #d4a373;
            --button-hover: #faedcd; --button-text: #584032; --accent-active: #e07a5f;
            --morandi-ruby: rgba(195, 110, 130, 0.92); --morandi-yellow: rgba(244, 211, 94, 0.85);
            --morandi-green: rgba(144, 190, 109, 0.85); --morandi-blue: rgba(144, 224, 239, 0.85);
            --muted-red: #C36E82; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Zen Maru Gothic", "Microsoft JhengHei", sans-serif; color: var(--text-main); -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; position: fixed; width: 100%; height: 100%; font-size: 18px; }
        
        #app { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; position: relative; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; position: absolute; top: 0; left: 0; background-color: var(--bg-color); padding: 15px; overflow-y: auto; }
        .screen.active { display: flex; }

        /* 首頁背景圖設定：使用本地 lobby-bg.png 並加上遮罩讓文字清晰易讀 */
        #lobby-screen { 
            background: linear-gradient(rgba(110, 100, 90, 0.5), rgba(110, 100, 90, 0.5)), url('lobby-bg.png'); 
            background-size: cover; 
            background-position: center;
            justify-content: center; 
            padding-top: 0;
        }
        .lobby-content-wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 450px; z-index: 2; }
        input, button { padding: 14px 22px; font-size: 18px; border-radius: 16px; border: 2px solid var(--card-border); margin: 6px; max-width: 100%; outline: none; z-index: 2; font-weight: normal; }
        #player-name-input { background: #ffffff; color: var(--text-main); text-align: center; width: 100%; max-width: 280px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); font-size: 22px; }
        button { background-color: var(--button-bg); color: #fff; border: none; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(212, 163, 115, 0.3); }
        button:hover:not(:disabled) { background-color: var(--accent-active); transform: translateY(-2px); }
        button:disabled { background: #e0d5cb !important; color: #a89a90 !important; cursor: not-allowed; transform: none; box-shadow: none; opacity: 0.6; }
        
        .room-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; margin-top: 15px; }
        .room-card { padding: 22px 12px; border-radius: 20px; text-align: center; cursor: pointer; color: #4a403a; box-shadow: 0 6px 15px rgba(0,0,0,0.05); font-size: 22px; border: 2px solid #fff; transition: all 0.2s; }
        .room-card.room-ruby { background: var(--morandi-ruby); } .room-card.room-yellow { background: var(--morandi-yellow); }
        .room-card.room-green { background: var(--morandi-green); } .room-card.room-blue { background: var(--morandi-blue); }
        
        #game-screen { background-color: var(--bg-color); }
        .game-header { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: clamp(15px, 4vw, 18px); padding: 12px 18px; background: #fffaf5; border-bottom: 2px solid var(--card-border); border-radius: 0 0 16px 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); flex-wrap: wrap; gap: 5px; }
        
        .players-bar { display: flex; gap: 8px; width: 100%; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
        /* 玩家圖卡：顏色區別與動物圖示 */
        .player-info-card { padding: 8px 14px; border-radius: 12px; font-size: clamp(14px, 3.5vw, 16px); border: 2px solid var(--card-border); white-space: nowrap; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .player-info-card:nth-child(1) { background-color: #e3f2fd; border-color: #90caf9; }
        .player-info-card:nth-child(2) { background-color: #fce4ec; border-color: #f48fb1; }
        .player-info-card:nth-child(3) { background-color: #e8f5e9; border-color: #a5d6a7; }
        .player-info-card:nth-child(4) { background-color: #fffde7; border-color: #fff59d; }

        .player-info-card.active-turn { border-color: var(--accent-active); box-shadow: 0 0 10px rgba(224, 122, 95, 0.5); }
        .p-score { color: var(--muted-red); font-size: 1.2em; font-weight: bold; }

        .center-pool { flex: 1; width: 100%; max-width: 700px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 12px; position: relative; }
        .discarded-tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; justify-items: center; width: 100%; max-width: 400px; }
        
        /* 棋子樣式 */
        .tile { 
            width: clamp(55px, 15vw, 75px); height: clamp(55px, 15vw, 75px); border-radius: 50%; background-color: transparent; 
            display: flex; justify-content: center; align-items: center; cursor: pointer; user-select: none; 
            background-size: cover; background-position: center; background-repeat: no-repeat; 
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.25)); font-size: 26px; border: none; outline: none; 
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            position: relative; 
        }
        .tile:active { transform: scale(0.95); }
        
        /* 剛打出的牌：放大 2 倍並加強陰影 */
        .tile.highlight { 
            filter: drop-shadow(0 0 15px rgba(224, 122, 95, 0.8)); 
            transform: scale(2); 
            z-index: 10; 
        }
        
        .tile.large { width: clamp(75px, 18vw, 95px); height: clamp(75px, 18vw, 95px); font-size: clamp(26px, 7vw, 38px); }
        
        /* 操作區排版：4等份 Grid 系統 */
        .action-panel { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 8px; margin: 10px auto; align-items: center; justify-items: center; width: 100%; max-width: 500px; 
        }
        .panel-slot {
            display: flex; justify-content: center; align-items: center; width: 100%; min-height: 55px;
        }
        .action-panel button { padding: 10px; font-size: clamp(15px, 4vw, 18px); border-radius: 12px; font-weight: normal; width: 100%; max-width: 90px; }
        
        /* 放大 1.3 倍的胡牌按鈕樣式 (尺寸與字體同步放大) */
        #btn-win {
            transform: scale(1.3);
            transform-origin: center;
            max-width: 110px !important;
            font-size: clamp(18px, 4.5vw, 22px) !important;
            padding: 12px 6px !important;
        }

        .timer-display { color: var(--accent-active); font-weight: bold; text-align: center; }
        
        .player-section { width: 100%; padding: 16px; display: flex; justify-content: center; min-height: 100px;}
        .my-tiles { display: flex; gap: 12px; align-items: center; justify-content: center; }
        
        #winner-display-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(247, 244, 239, 0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; border-radius: 20px;}
        #winner-display-overlay.active { display: flex; }
        .winning-rows-container { display: flex; flex-direction: column; gap: 12px; align-items: center; margin: 15px 0; }
        .winning-row { display: flex; gap: 12px; justify-content: center; }

        #ready-screen, #gameover-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(247, 244, 239, 0.98); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 50; padding: 20px; text-align: center; }
        #ready-screen.active, #gameover-screen.active { display: flex; }
        
        .ranking-table { width: 100%; max-width: 450px; border-collapse: collapse; margin: 15px 0; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .ranking-table th, .ranking-table td { padding: 10px 6px; border-bottom: 1px solid var(--card-border); text-align: center; font-size: 14px; }
        .ranking-table th { background: #fdfaf6; color: var(--accent-active); }
        
        #message-modal { position: fixed; top: 20px; background-color: #fffaf5; color: var(--accent-active); border: 2px solid var(--card-border); padding: 14px 24px; border-radius: 16px; font-size: 18px; display: none; z-index: 100; left: 50%; transform: translateX(-50%); }
    </style>
</head>
<body>
    <audio id="win-sound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" preload="auto"></audio>

<div id="app">
    <div id="message-modal">提示訊息</div>
    
    <div id="lobby-screen" class="screen active">
        <div class="lobby-content-wrapper">
            <input type="text" id="player-name-input" placeholder="請輸入暱稱">
            <div class="room-list" id="room-list-container"></div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <div id="ready-screen">
            <h2 style="color: var(--accent-active); font-size: 28px;">休息小棧</h2>
            <p style="margin: 15px 0; color: var(--text-light);">2~4 人皆可開始，等待眾人就位！</p>
            <button id="btn-ready" onclick="clickReady()" style="padding: 16px 40px; font-size: 20px;">準備出發</button>
            <button onclick="leaveRoom()" style="background: #e6d7cc; color: var(--text-main); margin-top: 15px;">返回大廳</button>
        </div>

        <div id="gameover-screen">
            <h2 style="color: var(--accent-active); font-size: 26px;">10局圓滿落幕 - 英雄榜</h2>
            <table class="ranking-table" id="ranking-table"></table>
            <button onclick="leaveRoom()">返回大廳</button>
        </div>

        <div class="game-header">
            <span id="room-name-display" style="color: var(--accent-active);">房間</span>
            <span id="round-display">第 1 / 10 局</span>
            <span id="turn-status-text" style="color: var(--accent-active);">等待中</span>
            <button style="padding: 6px 14px; font-size: 15px; background: #e6d7cc; color: var(--text-main);" onclick="leaveRoom()">退出</button>
        </div>

        <div class="players-bar" id="players-bar-container"></div>

        <div class="center-pool">
            <div id="winner-display-overlay">
                <h2 id="winner-title" style="color: var(--accent-active); font-size: 28px; margin-bottom: 5px;"></h2>
                <p id="winner-desc" style="font-size: 18px; color: var(--text-main); margin-bottom: 10px;"></p>
                
                <div class="winning-rows-container">
                    <div id="winning-row-top" class="winning-row"></div>
                    <div id="winning-row-bottom" class="winning-row"></div>
                </div>

                <div style="margin-top:15px; font-size: 16px; color: var(--text-light);">倒數 <span id="next-timer">5</span>s 進入下一把</div>
                <button id="btn-next-round" onclick="clickNextRound()" style="margin-top: 10px;">下一把</button>
            </div>
            <div class="discarded-tiles" id="discarded-pool"></div>
        </div>

        <!-- 操作區 -->
        <div class="action-panel">
            <!-- 第 1 格：摸牌 -->
            <div class="panel-slot">
                <button id="btn-draw" onclick="playerAction('draw')" disabled>摸牌</button>
            </div>
            
            <!-- 第 2 格：倒數計時 -->
            <div class="panel-slot">
                <div class="timer-display"><span id="timer-text" style="font-size: 42px; line-height: 1;">8</span></div>
            </div>
            
            <!-- 第 3 格：胡牌 (已拿掉驚嘆號) -->
            <div class="panel-slot">
                <button id="btn-win" onclick="playerAction('win')" style="background-color: var(--accent-active); border: 2px solid #ffccd5; display: none;">胡牌</button>
            </div>
            
            <!-- 第 4 格：吃牌 -->
            <div class="panel-slot">
                <button id="btn-eat" onclick="playerAction('eat')" disabled>吃牌</button>
            </div>
        </div>

        <div class="player-section">
            <div class="my-tiles" id="my-hand-tiles"></div>
        </div>
    </div>
</div>

<script>
    const socket = io();
    let gs = { id: '', pId: '', p: [], hand: [], pool: [], tIdx: 0, phase: '', turnCard: false };

    const animalAvatars = ['🐶', '🐱', '🐰', '🦊', '🐼', '🐨'];

    function getTileImg(name) {
        const m = {
            '帥':'red_shuai.png','仕':'red_shi.png','相':'red_xiang.png','俥':'red_che.png','傌':'red_ma.png','炮':'red_pao.png','兵':'red_bing.png',
            '將':'black_jiang.png','士':'black_shi.png','象':'black_xiang.png','車':'black_che.png','馬':'black_ma.png','包':'black_pao.png','卒':'black_zu.png'
        };
        return m[name] || '';
    }

    function showMsg(text) {
        const m = document.getElementById('message-modal');
        m.innerText = text; m.style.display = 'block';
        setTimeout(() => m.style.display = 'none', 2000);
    }

    function checkHuClient(hand, extraCard = null) {
        let testHand = [...hand];
        if (extraCard) testHand.push(extraCard);
        if (testHand.length !== 5) return false;
        
        let counts = {};
        testHand.forEach(t => counts[t] = (counts[t] || 0) + 1);

        const hasSubset = (subset) => {
            let temp = { ...counts };
            for (let t of subset) { if (!temp[t] || temp[t] <= 0) return false; temp[t]--; }
            return true;
        };
        const checkPairInRemaining = (subset) => {
            let temp = { ...counts };
            for (let t of subset) temp[t]--;
            let rem = [];
            for (let t in temp) { for (let i = 0; i < temp[t]; i++) rem.push(t); }
            return rem.length === 2 && rem[0] === rem[1];
        };

        if (counts['兵'] === 5 || counts['卒'] === 5) return true;
        if (hasSubset(['帥', '將', '兵', '兵', '兵']) || hasSubset(['帥', '將', '卒', '卒', '卒'])) return true;
        if ((counts['兵'] === 2 && counts['卒'] === 3) || (counts['兵'] === 3 && counts['卒'] === 2)) return true;
        
        const validPairs = ['仕', '相', '俥', '傌', '炮', '士', '象', '車', '馬', '包'];
        if (counts['兵'] === 3 || counts['卒'] === 3) {
            let pawnTile = counts['兵'] === 3 ? '兵' : '卒';
            let temp = { ...counts }; temp[pawnTile] -= 3;
            let rem = [];
            for (let t in temp) { for (let i = 0; i < temp[t]; i++) rem.push(t); }
            if (rem.length === 2 && rem[0] === rem[1]) return true;
        }
        if (hasSubset(['帥', '仕', '相']) && checkPairInRemaining(['帥', '仕', '相'])) return true;
        if (hasSubset(['將', '士', '象']) && checkPairInRemaining(['將', '士', '象'])) return true;
        if (hasSubset(['俥', '傌', '炮']) && checkPairInRemaining(['俥', '傌', '炮'])) return true;
        if (hasSubset(['車', '馬', '包']) && checkPairInRemaining(['車', '馬', '包'])) return true;

        return false;
    }

    socket.on('room_list', rooms => {
        const c = document.getElementById('room-list-container'); c.innerHTML = '';
        Object.values(rooms).forEach(r => {
            const d = document.createElement('div');
            d.className = `room-card ${r.colorClass}`;
            d.innerText = `${r.name}\n(${r.players.length}/4人)`;
            d.onclick = () => {
                const name = document.getElementById('player-name-input').value.trim();
                if(!name) return showMsg('請輸入暱稱');
                socket.emit('join_room', { roomId: r.id, playerName: name });
                document.getElementById('room-name-display').innerText = r.name;
                document.getElementById('lobby-screen').classList.remove('active');
                document.getElementById('game-screen').classList.add('active');
            };
            c.appendChild(d);
        });
    });

    function leaveRoom() { window.location.reload(); }
    function clickReady() { socket.emit('player_ready'); document.getElementById('btn-ready').innerText = '已就緒...'; document.getElementById('btn-ready').disabled = true; }
    function clickNextRound() { socket.emit('next_round_ready'); document.getElementById('btn-next-round').disabled = true; }
    function playerAction(t) { socket.emit('player_action', { roomId: gs.id, actionType: t }); }
    function selectTile(t) { socket.emit('player_action', { roomId: gs.id, actionType: 'discard', payload: { tile: t } }); }

    socket.on('timer_update', sec => {
        if(gs.phase === 'PLAYING') document.getElementById('timer-text').innerText = sec;
        if(gs.phase === 'ROUND_OVER') document.getElementById('next-timer').innerText = sec;
    });

    socket.on('action_feedback', d => showMsg(d.message));

    socket.on('room_state_update', st => {
        gs.id = st.id; gs.pId = socket.id; gs.p = st.players; gs.phase = st.phase; 
        gs.tIdx = st.currentTurnIndex; gs.turnCard = st.hasTakenCardThisTurn;
        gs.hand = st.myHands[socket.id] || []; gs.pool = st.discardPool || [];

        const rs = document.getElementById('ready-screen'), overlay = document.getElementById('winner-display-overlay');
        rs.classList.remove('active'); overlay.classList.remove('active');
        document.getElementById('round-display').innerText = `第 ${st.currentRound} / ${st.maxRounds} 局`;

        if (st.phase === 'WAITING') {
            rs.classList.add('active');
            let me = gs.p.find(p => p.id === gs.pId);
            if(me && !me.isReady) {
                let b = document.getElementById('btn-ready');
                b.innerText = '準備出發'; b.disabled = false;
            }
        } else if (st.phase === 'ROUND_OVER') {
            overlay.classList.add('active');
            document.getElementById('btn-next-round').disabled = false;
            
            const winAudio = document.getElementById('win-sound');
            if (winAudio) {
                winAudio.currentTime = 0;
                winAudio.play().catch(e => console.log("音效播放需要網頁互動授權", e));
            }

            if(st.winningInfo) {
                document.getElementById('winner-title').innerText = st.winningInfo.title || '流局';
                document.getElementById('winner-desc').innerText = st.winningInfo.desc || '';
                
                const rowTop = document.getElementById('winning-row-top');
                const rowBottom = document.getElementById('winning-row-bottom');
                rowTop.innerHTML = '';
                rowBottom.innerHTML = '';

                if(st.winningInfo.winningHand) {
                    st.winningInfo.winningHand.forEach((t, index) => {
                        let d = document.createElement('div'); d.className = 'tile large';
                        let img = getTileImg(t);
                        if(img) d.style.backgroundImage = `url('${img}')`; else d.innerText = t;
                        
                        if (index < 2) {
                            rowTop.appendChild(d);
                        } else {
                            rowBottom.appendChild(d);
                        }
                    });
                }
            }
        }
        updateUI(st);
    });

    socket.on('game_over', data => {
        document.getElementById('ready-screen').classList.remove('active');
        document.getElementById('winner-display-overlay').classList.remove('active');
        document.getElementById('gameover-screen').classList.add('active');
        
        let tb = document.getElementById('ranking-table');
        tb.innerHTML = '<tr><th>名次</th><th>玩家</th><th>總分</th><th>胡</th><th>槍</th><th>自摸</th><th>流局</th><th>勝率</th></tr>';
        const medals = ['🥇', '🥈', '🥉', '第四名'];
        data.rankings.forEach((p, i) => {
            let tr = document.createElement('tr');
            let winRate = Math.round((p.stats.hu / 10) * 100);
            tr.innerHTML = `<td>${medals[i] || i+1}</td><td>${p.name}</td><td><b>${p.score}</b></td>
                            <td>${p.stats.hu}</td><td>${p.stats.fangQiang}</td><td>${p.stats.zimo}</td>
                            <td>${p.stats.liuJu}</td><td>${winRate}%</td>`;
            tb.appendChild(tr);
        });
    });

    function updateUI(st) {
        const bar = document.getElementById('players-bar-container'); bar.innerHTML = '';
        let isMyTurn = (st.players[st.currentTurnIndex]?.id === gs.pId);

        st.players.forEach((p, index) => {
            let animal = animalAvatars[index % animalAvatars.length];
            let c = document.createElement('div');
            c.className = `player-info-card ${(st.players[st.currentTurnIndex]?.id === p.id && st.phase !== 'ROUND_OVER') ? 'active-turn' : ''}`;
            c.innerHTML = `<div>${animal} ${p.name}</div><div class="p-score">${p.score}</div>`;
            bar.appendChild(c);
        });

        let statusText = document.getElementById('turn-status-text');
        let dBtn = document.getElementById('btn-draw'), eBtn = document.getElementById('btn-eat'), wBtn = document.getElementById('btn-win');
        
        dBtn.disabled = true; 
        eBtn.disabled = true; 
        wBtn.style.display = 'none';

        const poolHasCards = gs.pool.length > 0;

        if (st.phase === 'PLAYING') {
            if (isMyTurn) {
                if (!st.hasTakenCardThisTurn) {
                    dBtn.disabled = false;
                    
                    if (poolHasCards) {
                        eBtn.disabled = false; 
                        statusText.innerText = '您的回合：請選擇【摸牌】或【吃牌】';
                    } else {
                        eBtn.disabled = true; 
                        statusText.innerText = '您的回合：第一手請【摸牌】';
                    }
                    
                    if (poolHasCards && checkHuClient(gs.hand, gs.pool[gs.pool.length - 1])) {
                        wBtn.style.display = 'block';
                    }
                } else {
                    statusText.innerText = '您的回合：請點擊手牌打出一張牌';
                    if (gs.hand.length === 5 && checkHuClient(gs.hand)) {
                        wBtn.style.display = 'block'; 
                    }
                }
            } else {
                statusText.innerText = `等待 ${st.players[st.currentTurnIndex]?.name || ''} 操作中...`;
                if (!st.hasTakenCardThisTurn && poolHasCards && checkHuClient(gs.hand, gs.pool[gs.pool.length - 1])) {
                    wBtn.style.display = 'block'; 
                }
            }
        }

        const hc = document.getElementById('my-hand-tiles'); hc.innerHTML = '';
        gs.hand.forEach(t => {
            let d = document.createElement('div'); d.className = 'tile';
            let img = getTileImg(t);
            if(img) d.style.backgroundImage = `url('${img}')`; else d.innerText = t;
            
            if(isMyTurn && st.hasTakenCardThisTurn && gs.hand.length > 4) {
                d.onclick = () => selectTile(t);
                d.style.cursor = 'pointer';
            } else {
                d.style.cursor = 'default';
            }
            hc.appendChild(d);
        });

        const pc = document.getElementById('discarded-pool'); pc.innerHTML = '';
        gs.pool.forEach((t, i) => {
            let d = document.createElement('div'); d.className = 'tile';
            d.style.width = 'clamp(40px, 10vw, 55px)'; d.style.height = 'clamp(40px, 10vw, 55px)'; d.style.fontSize = '20px';
            let img = getTileImg(t);
            if(img) d.style.backgroundImage = `url('${img}')`; else d.innerText = t;
            
            if (i === gs.pool.length - 1 && st.phase === 'PLAYING' && !st.hasTakenCardThisTurn) {
                d.classList.add('highlight');
            }
            pc.appendChild(d);
        });
    }
</script>
</body>
</html>
